<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Тесты Шага 3: шрифты</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>body{font:15px/1.5 system-ui,sans-serif;padding:16px;max-width:900px}.ok{color:#1a7f3c}.no{color:#c0392b;font-weight:700}pre{white-space:pre-wrap}</style></head>
<body><h1>Шаг 3: шрифты и типографика</h1><div id="out"></div><p id="sum"></p>
<script src="st-tokens.js"></script><script src="st-fonts.js"></script><script src="st-store.js"></script><script src="st-io.js"></script><script src="st-fontui.js"></script>
<script>
ST.io.cfg.db='catworking-studio-test'; /* отдельная база: рабочие данные не трогаем (STUDIO_RULES §5) */
var tests=[];function T(n,f){tests.push([n,f]);}
function eq(a,b,m){if(a!==b)throw new Error((m?m+': ':'')+'ожидали '+JSON.stringify(b)+', получили '+JSON.stringify(a));}
</script>
<script src="st-test-tokens.js"></script>
<script src="st-test-fonts.js"></script>
<script>
(function(){var out=document.getElementById('out'),pass=0,fail=0;
  function line(ok,n,e){out.insertAdjacentHTML('beforeend','<div class="'+(ok?'ok':'no')+'">'+(ok?'✓ ':'✗ ')+ST.esc(n)+(e?'<pre>'+ST.esc(e)+'</pre>':'')+'</div>');}
  var i=0;(function next(){if(i>=tests.length){document.getElementById('sum').textContent='Прошло: '+pass+', не прошло: '+fail;window.__result={pass:pass,fail:fail};return;}
    var t=tests[i++],r;try{r=t[1]();}catch(e){fail++;line(false,t[0],e.message);return next();}
    Promise.resolve(r).then(function(){pass++;line(true,t[0]);next();},function(e){fail++;line(false,t[0],e&&e.message);next();});})();})();
</script></body></html>
